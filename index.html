<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f613b" />
    <meta name="apple-mobile-web-app-title" content="R3foresta" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>R3foresta</title>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #08140f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      #root > .boot-screen {
        display: flex;
        min-height: 100vh;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background:
          radial-gradient(circle at 50% 25%, rgba(95, 154, 120, 0.28), transparent 42%),
          #08140f;
        color: #ffffff;
        text-align: center;
      }

      .boot-screen__content {
        width: 100%;
        max-width: 320px;
      }

      .boot-screen__icon {
        display: block;
        width: 80px;
        height: 80px;
        margin: 0 auto;
        border-radius: 22px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.28);
      }

      .boot-screen__brand {
        margin: 24px 0 0;
        color: #b8d2c2;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }

      .boot-screen__title {
        margin: 8px 0 0;
        font-size: 24px;
        line-height: 1.25;
      }

      .boot-screen__message {
        margin: 16px 0 0;
        color: #d9e8dd;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen">
        <section
          class="boot-screen__content"
          role="status"
          aria-live="polite"
          aria-busy="true"
        >
          <img
            class="boot-screen__icon"
            src="/icon-192.png"
            width="80"
            height="80"
            alt=""
          />
          <p class="boot-screen__brand">R3foresta</p>
          <h1 class="boot-screen__title">Abriendo la aplicación</h1>
          <p class="boot-screen__message">Estamos preparando tu espacio.</p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
